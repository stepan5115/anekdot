services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: laughder
      POSTGRES_USER: laughder
      POSTGRES_PASSWORD: laughder
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U laughder -d laughder"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/laughder
      DB_USER: laughder
      DB_PASSWORD: laughder
      PORT: 8080
      CORS_ORIGIN: http://localhost:5173
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8080
    depends_on:
      - api
    ports:
      - "5173:80"

volumes:
  postgres_data:

